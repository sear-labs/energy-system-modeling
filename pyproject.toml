[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esm"
version = "0.1.0.dev0"
description = "Companion package for the open textbook Introduction to Energy System Modeling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erick C. Jones, Jr." }]
keywords = ["energy system modeling", "optimization", "pypsa", "teaching"]

# Upper bounds on purpose, per Part 1 rule 3. These are the RANGE; the resolved
# list that produced the committed notebook outputs is requirements-lock.txt,
# and both are needed -- a range says what will install, only the lock says what
# ran.
#
# Deliberately narrow: this is what `esm` itself needs, which today is the data
# layer only. PyPSA and the solvers belong to the notebooks and are installed by
# their setup cell, so `pip install esm` does not drag a solver in.
dependencies = [
    "pandas>=3,<4",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/sear-labs/energy-system-modeling"
Book = "https://uta.pressbooks.pub/energysystemmodeling"

[project.optional-dependencies]
# Everything the notebooks need on top of the package. `pip install esm[notebooks]`
notebooks = [
    "pypsa>=1.3,<2",
    "linopy>=0.9,<1",
    "highspy>=1.11,<2",
    "gurobipy>=11,<14",
    "pulp>=3,<4",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "networkx>=3,<4",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
    "plotly>=6,<8",
    "ipywidgets>=8,<9",
]
dev = [
    "pytest>=8,<10",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: data/raw/ is NOT package data, and that is deliberate rather than an
# oversight. A data directory at the repo root does not go into the wheel, so
# `pip install git+https://...` ships the package WITHOUT the tables -- a defect
# the standard's Part 6 records as having shipped in three published repos.
#
# `esm.data` handles that case by falling back to the published raw URL rather
# than by vendoring a second copy of every CSV into the package. One copy, on
# the published branch, and no drift guard to maintain. See src/esm/data.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
